<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1400" height="1000" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- title -->
  <text x="700" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Agentic AI Log Analyzer — Open5GS Core &amp; RAN</text>
  <text x="700" y="66" text-anchor="middle" font-size="13.5" fill="#64748b">A cost-gated Claude agent triages real 5G Core/RAN logs, then opens a ServiceNow incident and archives evidence to S3</text>

  <!-- ===== SECTION 1: collect + gate ===== -->
  <text x="40" y="100" font-size="14.5" font-weight="700" fill="#334155">1 · Collect, tag, merge — every 5 minutes (cron)</text>

  <rect x="40" y="115" width="150" height="78" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="115" y="146" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">Pull AMF logs</text>
  <text x="115" y="163" text-anchor="middle" font-size="10.5" fill="#475569">SSH · kubectl logs</text>
  <text x="115" y="178" text-anchor="middle" font-size="9.5" fill="#94a3b8">Cloudlab-1</text>

  <rect x="40" y="205" width="150" height="78" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="115" y="236" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">Pull MME logs</text>
  <text x="115" y="253" text-anchor="middle" font-size="10.5" fill="#475569">SSH · kubectl logs</text>
  <text x="115" y="268" text-anchor="middle" font-size="9.5" fill="#94a3b8">Cloudlab-1</text>

  <rect x="40" y="295" width="150" height="78" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="115" y="326" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">Pull RAN logs</text>
  <text x="115" y="343" text-anchor="middle" font-size="10.5" fill="#475569">SSH · kubectl logs</text>
  <text x="115" y="358" text-anchor="middle" font-size="9.5" fill="#94a3b8">Cloudlab-1</text>

  <rect x="235" y="115" width="120" height="78" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="295" y="159" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Tag AMF</text>
  <rect x="235" y="205" width="120" height="78" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="295" y="249" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Tag MME</text>
  <rect x="235" y="295" width="120" height="78" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="295" y="339" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Tag RAN</text>

  <line x1="190" y1="154" x2="232" y2="154" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="190" y1="244" x2="232" y2="244" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="190" y1="334" x2="232" y2="334" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="405" y="205" width="150" height="78" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="480" y="240" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">Merge 3 sources</text>
  <text x="480" y="257" text-anchor="middle" font-size="10.5" fill="#475569">append mode</text>

  <line x1="355" y1="154" x2="380" y2="154" stroke="#475569" stroke-width="2"/>
  <line x1="380" y1="154" x2="380" y2="230" stroke="#475569" stroke-width="2"/>
  <line x1="380" y1="230" x2="402" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="355" y1="244" x2="402" y2="244" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="355" y1="334" x2="380" y2="334" stroke="#475569" stroke-width="2"/>
  <line x1="380" y1="334" x2="380" y2="258" stroke="#475569" stroke-width="2"/>
  <line x1="380" y1="258" x2="402" y2="258" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="600" y="205" width="170" height="78" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="685" y="234" text-anchor="middle" font-size="12.5" font-weight="600" fill="#713f12">Combine + regex</text>
  <text x="685" y="251" text-anchor="middle" font-size="11" fill="#854d0e">pre-filter (cost gate)</text>
  <text x="685" y="267" text-anchor="middle" font-size="9.5" fill="#a16207">runs before any LLM call</text>

  <line x1="555" y1="244" x2="597" y2="244" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- decision 1 -->
  <polygon points="850,205 940,244 850,283 760,244" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="850" y="240" text-anchor="middle" font-size="11.5" font-weight="600" fill="#78350f">Anomaly</text>
  <text x="850" y="255" text-anchor="middle" font-size="11.5" font-weight="600" fill="#78350f">detected?</text>
  <line x1="770" y1="244" x2="753" y2="244" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="820" y="200" text-anchor="middle" font-size="10" fill="#94a3b8">No → stop, no LLM cost</text>

  <!-- divider -->
  <line x1="40" y1="415" x2="1360" y2="415" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ===== SECTION 2: agent ===== -->
  <text x="40" y="448" font-size="14.5" font-weight="700" fill="#334155">2 · AI Agent — tool-calling + forced structured output</text>

  <line x1="850" y1="283" x2="850" y2="478" stroke="#475569" stroke-width="2"/>
  <line x1="850" y1="478" x2="743" y2="478" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="900" y="300" text-anchor="middle" font-size="10" fill="#94a3b8">Yes</text>

  <rect x="520" y="460" width="220" height="90" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="630" y="493" text-anchor="middle" font-size="14" font-weight="600" fill="#4c1d95">AI Agent</text>
  <text x="630" y="512" text-anchor="middle" font-size="11" fill="#5b21b6">NOC/SRE system prompt</text>
  <rect x="565" y="525" width="130" height="18" rx="9" fill="#ddd6fe"/>
  <text x="630" y="538" text-anchor="middle" font-size="10" fill="#4c1d95">Claude · Anthropic</text>

  <rect x="290" y="460" width="190" height="60" rx="10" fill="#cffafe" stroke="#0891b2" stroke-width="1.5"/>
  <text x="385" y="484" text-anchor="middle" font-size="11.5" font-weight="600" fill="#164e63">lookup_3gpp_pattern</text>
  <text x="385" y="500" text-anchor="middle" font-size="10" fill="#0e7490">tool · code-based knowledge base</text>
  <line x1="480" y1="490" x2="517" y2="490" stroke="#0891b2" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="290" y="535" width="190" height="60" rx="10" fill="#cffafe" stroke="#0891b2" stroke-width="1.5"/>
  <text x="385" y="559" text-anchor="middle" font-size="11.5" font-weight="600" fill="#164e63">Structured Output Parser</text>
  <text x="385" y="575" text-anchor="middle" font-size="10" fill="#0e7490">forces severity/cause/action JSON</text>
  <line x1="480" y1="565" x2="517" y2="510" stroke="#0891b2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- decision 2 -->
  <polygon points="900,460 990,505 900,550 810,505" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="900" y="500" text-anchor="middle" font-size="10.5" font-weight="600" fill="#78350f">Severity !=</text>
  <text x="900" y="514" text-anchor="middle" font-size="10.5" font-weight="600" fill="#78350f">INFO?</text>
  <line x1="743" y1="530" x2="806" y2="513" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1000" y="490" text-anchor="middle" font-size="10" fill="#94a3b8">No → stop, not reportable</text>

  <!-- divider -->
  <line x1="40" y1="635" x2="1360" y2="635" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ===== SECTION 3: fan-out ===== -->
  <text x="40" y="668" font-size="14.5" font-weight="700" fill="#334155">3 · Report — shared key, then ServiceNow + S3 in parallel</text>

  <line x1="900" y1="550" x2="900" y2="720" stroke="#475569" stroke-width="2"/>
  <line x1="900" y1="720" x2="790" y2="720" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="950" y="565" text-anchor="middle" font-size="10" fill="#94a3b8">Yes</text>

  <rect x="600" y="680" width="190" height="80" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="695" y="712" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b">Edit Fields</text>
  <text x="695" y="729" text-anchor="middle" font-size="10.5" fill="#475569">compute shared report_key</text>
  <text x="695" y="744" text-anchor="middle" font-size="9.5" fill="#94a3b8">sanitized component + timestamp</text>

  <line x1="600" y1="700" x2="450" y2="700" stroke="#475569" stroke-width="2"/>
  <line x1="450" y1="700" x2="450" y2="780" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="740" x2="450" y2="740" stroke="#475569" stroke-width="2"/>
  <line x1="450" y1="740" x2="450" y2="900" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="260" y="775" width="190" height="90" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="355" y="805" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">Create an incident</text>
  <text x="355" y="822" text-anchor="middle" font-size="10.5" fill="#166534">cmdb_ci mapped by component</text>
  <rect x="290" y="835" width="130" height="18" rx="9" fill="#bbf7d0"/>
  <text x="355" y="848" text-anchor="middle" font-size="10" fill="#14532d">ServiceNow (real PDI)</text>

  <rect x="260" y="895" width="190" height="90" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="355" y="925" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">Upload evidence</text>
  <text x="355" y="942" text-anchor="middle" font-size="10.5" fill="#1d4ed8">SSH · aws s3 cp</text>
  <rect x="290" y="955" width="130" height="18" rx="9" fill="#bfdbfe"/>
  <text x="355" y="968" text-anchor="middle" font-size="10" fill="#1e3a8a">Floci (S3 emulator)</text>

  <line x1="260" y1="820" x2="60" y2="820" stroke="#475569" stroke-width="2"/>
  <line x1="60" y1="820" x2="60" y2="790" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="700" width="190" height="90" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="155" y="732" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Append report</text>
  <text x="155" y="749" text-anchor="middle" font-size="10.5" fill="#475569">SSH · ai_log_analysis_report.md</text>
  <text x="155" y="765" text-anchor="middle" font-size="9.5" fill="#94a3b8">Cloudlab-1 (local evidence copy)</text>

  <!-- legend -->
  <rect x="1000" y="860" width="14" height="14" rx="3" fill="#f1f5f9" stroke="#64748b"/>
  <text x="1020" y="871" font-size="11" fill="#475569">Infra / SSH</text>
  <rect x="1000" y="884" width="14" height="14" rx="3" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="1020" y="895" font-size="11" fill="#475569">AI Agent</text>
  <rect x="1000" y="908" width="14" height="14" rx="3" fill="#cffafe" stroke="#0891b2"/>
  <text x="1020" y="919" font-size="11" fill="#475569">Tool / output parser</text>
  <rect x="1150" y="860" width="14" height="14" rx="3" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1170" y="871" font-size="11" fill="#475569">ServiceNow (real)</text>
  <rect x="1150" y="884" width="14" height="14" rx="3" fill="#dbeafe" stroke="#2563eb"/>
  <text x="1170" y="895" font-size="11" fill="#475569">S3 via Floci (simulated on purpose)</text>
  <rect x="1150" y="908" width="14" height="14" rx="3" fill="#fef3c7" stroke="#d97706"/>
  <text x="1170" y="919" font-size="11" fill="#475569">Decision gate</text>
</svg>
